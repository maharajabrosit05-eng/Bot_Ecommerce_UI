<nav aria-label="breadcrumb" *ngIf="items?.length">
  <ol class="breadcrumb app-breadcrumb mb-0">
    <li
      class="breadcrumb-item"
      *ngFor="let item of items; let last = last"
      [class.active]="last">

      <ng-container *ngIf="item.link && !last; else plainLabel">
        <a [routerLink]="item.link">
          <i [class]="item.icon" *ngIf="item.icon"></i>
          {{ item.label }}
        </a>
      </ng-container>

      <ng-template #plainLabel>
        <i [class]="item.icon" *ngIf="item.icon"></i>
        {{ item.label }}
      </ng-template>

    </li>
  </ol>
</nav>
