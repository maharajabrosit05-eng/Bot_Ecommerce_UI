<div class="error-page">
  <div class="error-card">
    <div class="error-icon-wrap tone-danger">
      <i class="ri-wifi-off-line"></i>
    </div>

    <h1 class="error-title">Can't reach the server</h1>
    <p class="error-desc">
      Check your internet connection — or the server might be temporarily
      down. Please try again in a moment.
    </p>

    <div class="error-actions">
      <button class="error-btn primary" (click)="retry()">
        <i class="ri-refresh-line"></i> Retry
      </button>
    </div>

    <div class="error-brand">BORS IT SOLUTIONS</div>
  </div>
</div>
